name: Provjera suradnje
on:
  push:
    branches: [mail]
  pull_request:
    branches: [mail]
permissions:
  contents: read
concurrency:
  group: collaboration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-development:
    name: Windows razvoj
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '8.0.x'
      - name: Validate office scripts without changing accounts or permissions
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/team/*.ps1 | ForEach-Object {
            $tokens = $null; $problems = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$problems) | Out-Null
            $errors += $problems
          }
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell parse failed' }
      - name: Build and test native development app with fixtures
        shell: pwsh
        run: ./scripts/team/Dev.ps1 -Action Test
      - name: Build isolated personal Studio and test boundaries without owner credentials
        shell: pwsh
        run: |
          dotnet build studio/TermoDom.Studio.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project studio/tests/Studio.Tests.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  android-unit:
    name: Android testovi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Native debug compilation and local fixture tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
  source-safety:
    name: Provjera izvora
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject credential files and common real token formats
        run: python3 scripts/team/check-source.py
  studio-installer:
    name: Studio instalater
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '8.0.x'
      - name: Download verified official Codex and Git tooling
        shell: pwsh
        run: ./studio/Download-Tools.ps1 -Destination "$env:RUNNER_TEMP/studio-tools"
      - name: Test real protocol with synthetic conversation and no owner login
        shell: pwsh
        run: |
          dotnet run --project studio/tests/Studio.Tests.csproj -- "--codex=$env:RUNNER_TEMP/studio-tools/codex/vendor/x86_64-pc-windows-msvc/bin/codex.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build personal Studio installer from reviewed project source
        shell: pwsh
        run: |
          ./studio/Build.ps1 -CodexPackageDirectory "$env:RUNNER_TEMP/studio-tools/codex" -GitDirectory "$env:RUNNER_TEMP/studio-tools/git" -ToolManifest "$pwd/studio/tool-manifest.json" -OutputDirectory "$env:RUNNER_TEMP/studio-package"
          Get-FileHash "$env:RUNNER_TEMP/studio-package/installer/TermoDom-Studio-Setup-1.0.0-x64.exe" -Algorithm SHA256 | Format-List | Out-File "$env:RUNNER_TEMP/studio-package/installer/SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TermoDom-Studio-Windows-installer
          path: |
            ${{ runner.temp }}/studio-package/installer/TermoDom-Studio-Setup-1.0.0-x64.exe
            ${{ runner.temp }}/studio-package/installer/SHA256.txt
          retention-days: 7
          if-no-files-found: error
